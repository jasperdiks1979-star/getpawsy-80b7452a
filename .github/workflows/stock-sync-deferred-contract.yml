name: Stock Sync Deferred Contract (manual approval only)
# Explicitly manual: do not consume GitHub Actions minutes before budget approval.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-sync-deferred-contract
  cancel-in-progress: true

jobs:
  deferred-unit-and-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test checkpoint, recovery, deferred decisions and authorization
        run: bash scripts/verify-stock-recovery-offline.sh
      - name: Typecheck stock Edge function
        run: deno check supabase/functions/sync-stock/index.ts

  deferred-postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: getpawsy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: getpawsy_test
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/getpawsy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned PostgreSQL test driver
        run: npm install --prefix "$RUNNER_TEMP/db-test" --ignore-scripts --no-audit --no-fund postgres@3.4.9
      - name: Verify worker migration, permissions, retries and concurrent claims
        run: |
          cp tests/stock-deferred-worker.integration.mjs "$RUNNER_TEMP/db-test/stock-deferred-worker.integration.mjs"
          node "$RUNNER_TEMP/db-test/stock-deferred-worker.integration.mjs"
