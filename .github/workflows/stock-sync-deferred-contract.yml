name: Stock Sync Deferred Contract (manual approval only)
run-name: Deferred stock contract — ${{ inputs.test_branch }}
# Explicitly manual: do not consume GitHub Actions minutes before budget approval.
on:
  workflow_dispatch:
    inputs:
      test_branch:
        description: 'Code branch to test (not the workflow branch)'
        required: true
        type: string
        default: fix/stock-sync-deferred-no-data-20261102

permissions:
  contents: read

concurrency:
  group: stock-sync-deferred-contract-${{ inputs.test_branch }}
  cancel-in-progress: true

jobs:
  deferred-unit-and-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout explicitly selected code branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_branch }}
          persist-credentials: false
      - name: Verify selected branch contains contract fixtures
        shell: bash
        run: |
          echo "Testing commit: $(git rev-parse HEAD)"
          test -f tests/stock-sync-deferred-policy.node.test.ts || { echo '::error::Deferred Node contract missing on selected branch'; exit 1; }
          test -f tests/stock-sync-deferred-queue.sql || { echo '::error::Deferred SQL contract missing on selected branch'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deferred decision and persisted cursor
        run: node --experimental-strip-types --test tests/stock-sync-deferred-policy.node.test.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck stock Edge function
        run: deno check supabase/functions/sync-stock/index.ts

  deferred-postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout explicitly selected code branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_branch }}
          persist-credentials: false
      - name: Verify selected branch contains contract fixtures
        shell: bash
        run: |
          echo "Testing commit: $(git rev-parse HEAD)"
          test -f tests/stock-sync-deferred-policy.node.test.ts || { echo '::error::Deferred Node contract missing on selected branch'; exit 1; }
          test -f tests/stock-sync-deferred-queue.sql || { echo '::error::Deferred SQL contract missing on selected branch'; exit 1; }
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Verify service-role, exact cursor, replay and no false completion
        run: psql -X -v ON_ERROR_STOP=1 -f tests/stock-sync-deferred-queue.sql
