name: Stock Sync Deferred Contract (manual approval only)
# Explicitly manual: do not consume GitHub Actions minutes before budget approval.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-sync-deferred-contract
  cancel-in-progress: true

jobs:
  deferred-unit-and-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deferred decision and persisted cursor
        run: node --experimental-strip-types --test tests/stock-sync-deferred-policy.node.test.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck stock Edge function
        run: deno check supabase/functions/sync-stock/index.ts

  deferred-postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Verify service-role, exact cursor, replay and no false completion
        run: psql -X -v ON_ERROR_STOP=1 -f tests/stock-sync-deferred-queue.sql
